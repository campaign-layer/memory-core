services:
  memory-core:
    build: .
    ports:
      - "127.0.0.1:7401:7401"
    environment:
      HOST: "0.0.0.0"
      MEMORY_PROVIDER: postgres
      MEMORY_PG_URL: postgres://memory:memory@db:5432/memory_core
      MEMORY_PG_AUTO_MIGRATE: "true"
      MEMORY_CORE_PRINCIPAL_API_KEYS: >-
        [{"key":"claude-local-demo","tenantId":"local","spaceId":"shared-demo","appId":"claude","actorId":"demo-user"},{"key":"codex-local-demo","tenantId":"local","spaceId":"shared-demo","appId":"codex","actorId":"demo-user"},{"key":"hermes-local-demo","tenantId":"local","spaceId":"shared-demo","appId":"hermes","actorId":"demo-user"}]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_core
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_core"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
