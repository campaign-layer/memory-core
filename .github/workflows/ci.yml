name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --omit=optional

      - run: npm run typecheck

      - run: npm run bench:typecheck

      # RETRIEVAL_ONNX_TEST is deliberately unset: that case downloads a ~35 MB model.
      - run: npm test

      - run: npm run build

      - name: Validate the shared-agent launch demo
        if: matrix.node == '22'
        run: node --check examples/shared-agent-demo.mjs

      - name: Verify the embedded MCP lifecycle and restart persistence
        if: matrix.node == '22'
        run: npm run verify:mcp

      - name: Assert generated integration schemas are current
        if: matrix.node == '22'
        run: |
          npm run integrations:schemas
          git diff --exit-code -- src/integrations/adapters/hermes-plugin/schemas.json

      - name: Validate the dependency-free Hermes plugin
        if: matrix.node == '22'
        run: |
          python3 -m py_compile src/integrations/adapters/hermes-plugin/tools.py
          python3 -m unittest discover -s src/integrations/adapters/hermes-plugin -p 'test_*.py'

  bench:
    # The random control must stay beatable and the fixture must stay reproducible.
    # BM25-only, so no model download and no API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --omit=optional

      - run: npx tsx bench/run.ts --systems=random,bm25,in-memory --size=small --k=10 --fail-on-at-or-below-random

      - run: npm run bench:context -- --time-anchor=2026-08-29T00:00:00.000Z --assert-baseline

      - name: Assert the fixture is byte-identical after regeneration
        run: |
          npm run bench:dataset
          npx tsx bench/dataset/generate.ts --size=large
          git diff --exit-code -- bench/dataset/generated

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_core_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_core_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MEMORY_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_core_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run test:pg

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the one-command Compose stack
        run: docker compose config --quiet
      - name: Build production image without optional ONNX dependencies
        run: docker compose build memory-core
      - name: Assert optional local model is absent
        run: >-
          docker compose run --rm --no-deps --entrypoint node memory-core -e
          "try { require.resolve('@huggingface/transformers'); process.exit(1) }
          catch (error) { process.exit(error.code === 'MODULE_NOT_FOUND' ? 0 : 1) }"
      - name: Start the documented Compose topology
        run: docker compose up --detach
      - name: Exercise isolated cross-agent-principal memory sharing
        run: node examples/shared-agent-demo.mjs
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup Compose stack
        if: always()
        run: docker compose down --volumes
